<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - Sudeep Kumar Reddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #121212; /* Matte black */
      color: #8b0000; /* Dark red */
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Subtle matte radial overlay for depth */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(30, 30, 30, 0.6) 0%, rgba(18, 18, 18, 1) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2.5rem 3rem;
      border-radius: 16px;
      background: rgba(22, 22, 22, 0.7);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6),
                  inset 0 1px 1px 0 rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(139, 0, 0, 0.15);
      backdrop-filter: blur(8px);
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .container:hover {
      transform: translateY(-2px);
      border-color: rgba(139, 0, 0, 0.35);
      box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.8),
                  0 0 25px rgba(139, 0, 0, 0.15);
    }

    .greeting-text {
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #8b0000;
      text-shadow: 0 2px 10px rgba(139, 0, 0, 0.3);
      user-select: none;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1 class="greeting-text">Hii! Sudeep Kumar Reddy</h1>
  </main>
</body>
</html>
